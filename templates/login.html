{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-12 p-8 bg-slate-900/50 border border-slate-800 rounded-2xl shadow-xl">
  <h2 class="text-2xl font-bold text-white mb-2">Login Portal</h2>
  <p class="text-sm text-slate-400 mb-6">Masukkan kredensial akun perpustakaan Anda.</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
      <input type="text" name="username" required class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-indigo-500 text-sm">
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition mt-2">Masuk</button>
  </form>

  <div class="mt-6 pt-6 border-t border-slate-800 text-xs text-slate-500 space-y-1 font-mono">
    <p>Demo Akun Pustakawan: <span class="text-slate-300">admin / admin123</span></p>
    <p>Demo Akun Anggota: <span class="text-slate-300">member / user123</span></p>
  </div>
</div>
{% endblock %}
